services:
  - type: web
    name: birdbot-dashboard
    runtime: python
    plan: free
    branch: main
    autoDeployTrigger: commit
    # yt-dlp's current YouTube extractor needs a JavaScript runtime for its
    # EJS challenge solver. Install Deno into Render's persisted project area
    # during the build and expose it again when the service starts.
    buildCommand: export DENO_INSTALL=/opt/render/project/.deno && curl -fsSL https://deno.land/install.sh | sh && pip install -r requirements.txt
    startCommand: export DENO_INSTALL=/opt/render/project/.deno && export PATH="$DENO_INSTALL/bin:$PATH" && python run.py
    envVars:
      - key: DENO_INSTALL
        value: /opt/render/project/.deno
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DISCORD_TOKEN
        sync: false
      - key: COMMAND_PREFIX
        value: "!"
      - key: GUILD_ID
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: DISCORD_OWNER_ID
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: BIRDBOT_DATA_PATH
        value: data/birdbot.sqlite3
      - key: SUPPORT_URL
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_REDIRECT_URI
        sync: false
      - key: SPOTIFY_PREMIUM_REQUIRED
        value: "0"
      - key: SPOTIFY_PREMIUM_USER_IDS
        sync: false
      - key: DASHBOARD_PUBLIC_URL
        sync: false
      - key: FFMPEG_PATH
        sync: false
      - key: YTDLP_COOKIES_FILE
        sync: false
      - key: YTDLP_JS_RUNTIME_PATH
        sync: false
      - key: SPY_JOIN_EMOJI
        sync: false
      - key: SPY_LEAVE_EMOJI
        sync: false
      - key: SPY_PLAYERS_EMOJI
        sync: false
      - key: SPY_START_EMOJI
        sync: false
      - key: SPY_SKIP_EMOJI
        sync: false
      - key: ROULETTE_JOIN_EMOJI
        sync: false
      - key: ROULETTE_LEAVE_EMOJI
        sync: false
      - key: ROULETTE_PLAYERS_EMOJI
        sync: false
      - key: ROULETTE_START_EMOJI
        sync: false
